services:
    _defaults:
        autoconfigure: true
        autowire: true

#    resource: ../src/Controller
#    #exclude: ../src/{Config,ContaoManager,DependencyInjection,Exception,Model,FormField,ContaoEventRegistrationBundle.php,NotificationTypes.php}


    fiedsch_ligaverwaltung.helper.ranking:
        class: Fiedsch\Ligaverwaltung\Helper\RankingHelper
        public: true

    fiedsch_ligaverwaltung.migration.haspaidmigration:
        class: Fiedsch\Ligaverwaltung\Migration\HasPaidMigration
        arguments:
            - '@database_connection'
        tags:
            - { name: contao.migration, priority: 0 }

    fiedsch_ligaverwaltung.migration.patchsaisonmigration:
        class: Fiedsch\Ligaverwaltung\Migration\PatchSaisonMigration
        arguments:
            - '@database_connection'
        tags:
            - { name: contao.migration, priority: 0 }

#    fiedsch_ligaverwaltung.controller.backend:
#        class: Fiedsch\Ligaverwaltung\Controller\LigaverwaltungBackendController
#        tags: ['controller.service_arguments']
#        calls:
#            - [ setContainer, [ '@service_container' ] ]

    fiedsch_ligaverwaltung.controller.ical:
        class: Fiedsch\Ligaverwaltung\Controller\IcalController
        arguments:
            - '@contao.framework'
        tags: ['controller.service_arguments']

    fiedsch_ligaverwaltung.controller.json:
        public: true
        class: Fiedsch\Ligaverwaltung\Controller\JsonController
        arguments:
            - '@contao.framework'
        tags: ['controller.service_arguments']

    fiedsch_ligaverwaltung.listener.buttons_callback:
        class: Fiedsch\Ligaverwaltung\EventListener\DataContainer\EditButtonsCallbackListener
        tags: ['controller.service_arguments']

    fiedsch_ligaverwaltung.controller.player_history:
        class: Fiedsch\Ligaverwaltung\Controller\Backend\PlayerHistoryController
        public: true
        arguments:
            - '@twig'
        tags: ['controller.service_arguments']

    fiedsch_ligaverwaltung.controller.content.ranking:
        class: Fiedsch\Ligaverwaltung\Controller\ContentElement\RankingController
        arguments:
            - '@fiedsch_ligaverwaltung.helper.ranking'

    Fiedsch\Ligaverwaltung\Controller\ContentElement\LigenlisteController: ~
    Fiedsch\Ligaverwaltung\Controller\ContentElement\MannschaftslisteController: ~
    Fiedsch\Ligaverwaltung\Controller\ContentElement\SpielberichtController: ~
    Fiedsch\Ligaverwaltung\Controller\ContentElement\SpielerlisteController: ~
