services:
    _defaults:
        autoconfigure: true
        # autowire: true

    fiedsch_ligaverwaltung.helper.ranking:
        class: Fiedsch\LigaverwaltungBundle\Helper\RankingHelper
        public: true

    fiedsch_ligaverwaltung.migration.haspaidmigration:
        class: Fiedsch\LigaverwaltungBundle\Migration\HasPaidMigration
        arguments:
            - '@database_connection'
        tags:
            - { name: contao.migration, priority: 0 }

    fiedsch_ligaverwaltung.migration.patchsaisonmigration:
        class: Fiedsch\LigaverwaltungBundle\Migration\PatchSaisonMigration
        arguments:
            - '@database_connection'
        tags:
            - { name: contao.migration, priority: 0 }

    fiedsch_ligaverwaltung.controller.backend:
        class: Fiedsch\LigaverwaltungBundle\Controller\LigaverwaltungBackendController
        tags: ['controller.service_arguments']
        calls:
            - [ setContainer, [ '@service_container' ] ]

    fiedsch_ligaverwaltung.controller.ical:
        class: Fiedsch\LigaverwaltungBundle\Controller\IcalController
        arguments:
            - '@contao.framework'
        tags: ['controller.service_arguments']

    fiedsch_ligaverwaltung.controller.json:
        class: Fiedsch\LigaverwaltungBundle\Controller\JsonController
        arguments:
            - '@contao.framework'
        tags: ['controller.service_arguments']

    fiedsch_ligaverwaltung.listener.buttons_callback:
        class: Fiedsch\LigaverwaltungBundle\EventListener\DataContainer\EditButtonsCallbackListener
        tags: ['controller.service_arguments']

    fiedsch_ligaverwaltung.controller.player_history:
        class: Fiedsch\LigaverwaltungBundle\Controller\Backend\PlayerHistoryController
        public: true
        arguments:
            - '@twig'
        tags: ['controller.service_arguments']

    fiedsch_ligaverwaltung.controller.content.ranking:
        class: Fiedsch\LigaverwaltungBundle\Controller\ContentElement\RankingController
        arguments:
            - '@fiedsch_ligaverwaltung.helper.ranking'

    Fiedsch\LigaverwaltungBundle\Controller\ContentElement\LigenlisteController: ~
    Fiedsch\LigaverwaltungBundle\Controller\ContentElement\MannschaftslisteController: ~
    Fiedsch\LigaverwaltungBundle\Controller\ContentElement\SpielberichtController: ~
    Fiedsch\LigaverwaltungBundle\Controller\ContentElement\SpielerlisteController: ~
